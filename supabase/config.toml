project_id = "bricktime"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5174"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Patvirtink savo BRICKTIME paskyrą"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Atstatyk savo BRICKTIME slaptažodį"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Tavo BRICKTIME prisijungimo nuoroda"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Patvirtink naują el. paštą"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Tave pakvietė prisijungti prie BRICKTIME"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Tavo BRICKTIME patvirtinimo kodas"
content_path = "./supabase/templates/reauthentication.html"

[functions.stripe-webhook]
verify_jwt = false
